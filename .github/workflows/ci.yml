name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the language check can scan every commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Language check (English only, including git history)
        run: npm run check:lang:all

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
